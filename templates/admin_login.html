<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login – CareerGenie AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #f5f6fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 44px 48px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        .top { text-align: center; margin-bottom: 32px; }
        .top .icon {
            width: 56px; height: 56px;
            background: #eef2ff;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
            font-size: 1.5rem;
        }
        .top h1 { font-size: 1.3rem; font-weight: 800; color: #0f172a; }
        .top p { font-size: 0.82rem; color: #94a3b8; margin-top: 4px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { font-size: 0.82rem; font-weight: 600; color: #374151; margin-bottom: 6px; display: block; }
        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.88rem;
            font-family: 'Poppins', sans-serif;
            color: #334155;
            background: #f8fafc;
            outline: none;
            transition: all 0.2s;
        }
        .form-group input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
            background: #fff;
        }
        .btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 4px 14px rgba(99,102,241,0.3);
            transition: all 0.2s;
            margin-top: 6px;
        }
        .btn:hover { background: linear-gradient(135deg, #4f46e5, #3730a3); transform: translateY(-1px); }
        .alert-box {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.82rem;
            margin-bottom: 20px;
        }
        .back { text-align: center; margin-top: 20px; font-size: 0.82rem; color: #94a3b8; }
        .back a { color: #6366f1; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="top">
            <div class="icon">&#9881;</div>
            <h1>Admin Access</h1>
            <p>Sign in to the admin dashboard</p>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert-box">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <form method="POST" action="/admin/login">
            <div class="form-group">
                <label>Admin Email</label>
                <input type="email" name="email" placeholder="admin@careergenie.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn">Sign In as Admin</button>
        </form>
        <div class="back"><a href="/login">Back to User Login</a></div>
    </div>
</body>
</html>
